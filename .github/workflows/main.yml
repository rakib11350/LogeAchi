name: LogeAchi Dot Com

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found!"
            exit 1
          fi
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          cd extracted
          # Check if inner folder exists and move into it
          if [ ! -f "gradlew" ]; then
            INNER_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ -n "$INNER_DIR" ]; then
              cd "$INNER_DIR"
            fi
          fi
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, using system gradle"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogeAchi-dot-com
          path: extracted/**/*.apk
