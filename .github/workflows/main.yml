name: Build LogeAchi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o LogeAchi-Android-GitHub.zip.zip -d extracted
          find extracted -name "gradlew" -exec chmod +x {} \;

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          TARGET_DIR=$(dirname $(find extracted -name "gradlew" | head -n 1))
          cd "$TARGET_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LogeAchi-debug-APK
          path: extracted/**/*.apk
